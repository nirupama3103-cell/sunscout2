<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;
  font-family:'Nunito',-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#17324D 0%,#24557d 55%,#4FA8DA 100%);
  color:#fff;position:relative;display:flex;flex-direction:column;
  justify-content:center;padding:0 78px}
/* soft marigold glow, echoes the site's sunny treatment */
.glow{position:absolute;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,169,59,.30) 0%,rgba(242,169,59,0) 70%);
  right:-140px;top:-150px}
.glow2{position:absolute;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle,rgba(79,168,218,.28) 0%,rgba(79,168,218,0) 70%);
  left:-160px;bottom:-190px}
.badge{display:inline-flex;align-items:center;gap:11px;align-self:flex-start;
  background:rgba(242,169,59,.20);border:2px solid rgba(242,169,59,.6);
  color:#FFE0AE;border-radius:99px;padding:10px 24px;
  font-size:23px;font-weight:900;letter-spacing:.4px;margin-bottom:30px}
h1{font-size:74px;font-weight:900;letter-spacing:-2.4px;line-height:1.03;
  max-width:1010px;margin-bottom:26px}
h1 em{font-style:normal;color:#F2A93B}
p{font-size:28px;font-weight:700;color:rgba(255,255,255,.88);max-width:900px;line-height:1.35}
.foot{position:absolute;left:78px;bottom:46px;display:flex;align-items:center;gap:14px}
.dot{width:13px;height:13px;border-radius:50%;background:#F2A93B}
.brand{font-size:26px;font-weight:900;letter-spacing:.2px}
.brand span:first-child{color:#F2A93B}
.cities{position:absolute;right:78px;bottom:50px;font-size:19px;font-weight:800;
  color:rgba(255,255,255,.62);text-align:right;line-height:1.45}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<span class="badge">🎃 Halloween 2026 · South Bay</span>
<h1>Halloween, sorted by<br><em>how scary it isn't</em></h1>
<p>Pumpkin patches, trunk-or-treats and sensory-friendly picks — rated 1 to 4 for scare level.</p>
<div class="foot"><span class="dot"></span><span class="brand"><span>Sun</span><span>Scout</span></span></div>
<div class="cities">Sunnyvale · San Jose · Cupertino · Mountain&nbsp;View<br>Palo Alto · Saratoga · Fremont</div>
</body></html>
