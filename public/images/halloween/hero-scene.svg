<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" preserveAspectRatio="xMaxYMax meet" role="img" aria-label="">
  <!--
    Original SunScout artwork for the Halloween hub hero. A generic Halloween
    motif drawn from scratch in the Open Sky palette — not a copy of any
    stock or Figma Community illustration.

    Composed as a RIGHT-SIDE VIGNETTE. The hub's headline and lede occupy the
    left ~60% of the hero, so every element here sits in the right third or
    along the very bottom. That keeps the text on the flat navy ground it was
    contrast-tested against, and lets the scrim stay light enough over the
    art for the scene to actually read.
  -->
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD489" stop-opacity=".42"/>
      <stop offset="42%"  stop-color="#F2A93B" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE0A3"/>
      <stop offset="100%" stop-color="#F2A93B"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0F2740"/>
      <stop offset="100%" stop-color="#0A1B2C"/>
    </linearGradient>
  </defs>

  <!-- moon, upper right -->
  <circle cx="556" cy="104" r="152" fill="url(#moonGlow)"/>
  <circle cx="556" cy="104" r="46" fill="#FFEAC4"/>
  <circle cx="573" cy="91"  r="7.5" fill="#E8B85F" opacity=".30"/>
  <circle cx="543" cy="118" r="5.5" fill="#E8B85F" opacity=".24"/>
  <circle cx="562" cy="124" r="4"   fill="#E8B85F" opacity=".20"/>
  <circle cx="540" cy="93"  r="3"   fill="#E8B85F" opacity=".18"/>

  <!-- bats drifting across the moon -->
  <g fill="#0B1D30">
    <path d="M420 96c9-10 15-3 19 2 4-5 10-12 19-2-7 0-13 4-19 11-6-7-12-11-19-11z"/>
    <path d="M646 158c6-7 11-2 14 2 3-4 8-9 14-2-6 0-9 3-14 8-5-5-8-8-14-8z"/>
    <path d="M470 200c5-6 9-2 11 1 2-3 6-8 11-1-4 0-7 2-11 6-4-4-7-6-11-6z"/>
  </g>

  <!-- far ridge -->
  <path d="M0 322 C 120 300, 260 320, 400 312 C 540 304, 620 322, 720 312 L720 420 L0 420 Z"
        fill="#12293F" opacity=".85"/>

  <!-- house, right of centre — stylised, warm lit windows, no gravestones -->
  <g>
    <path d="M250 322 L250 236 L304 190 L358 236 L358 322 Z" fill="#0B1D30"/>
    <path d="M304 190 L304 154 L312 154 L312 196 Z" fill="#0B1D30"/>
    <path d="M366 322 L366 258 L402 228 L438 258 L438 322 Z" fill="#0B1D30"/>
    <path d="M214 322 L214 272 L242 250 L270 272 L270 322 Z" fill="#0B1D30"/>
    <rect x="272" y="250" width="18" height="26" rx="3" fill="url(#win)"/>
    <rect x="306" y="250" width="18" height="26" rx="3" fill="url(#win)" opacity=".92"/>
    <rect x="272" y="288" width="18" height="24" rx="3" fill="url(#win)" opacity=".72"/>
    <rect x="330" y="284" width="16" height="28" rx="3" fill="url(#win)" opacity=".58"/>
    <rect x="386" y="270" width="15" height="22" rx="3" fill="url(#win)" opacity=".85"/>
    <rect x="410" y="270" width="15" height="22" rx="3" fill="url(#win)" opacity=".5"/>
    <rect x="226" y="284" width="14" height="20" rx="3" fill="url(#win)" opacity=".62"/>
    <path d="M294 322 L294 296 Q304 284 314 296 L314 322 Z" fill="url(#win)"/>
  </g>

  <!-- bare tree, far right -->
  <g stroke="#0B1D30" stroke-linecap="round" fill="none">
    <path d="M652 322 L652 250" stroke-width="8"/>
    <path d="M652 278 L628 254 M652 270 L676 246 M652 258 L637 240 M652 254 L668 236"
          stroke-width="4.5"/>
    <path d="M628 254 L617 244 M676 246 L687 237 M637 240 L630 232" stroke-width="3"/>
  </g>

  <!-- near hill -->
  <path d="M0 352 C 140 332, 300 356, 440 348 C 570 340, 640 358, 720 350 L720 420 L0 420 Z"
        fill="url(#hill)"/>

  <!-- pumpkins on the near ridge -->
  <g>
    <g transform="translate(486 340)">
      <ellipse cx="0" cy="0" rx="23" ry="19" fill="#F2A93B"/>
      <path d="M-12 -18 q-2 -10 5 -13" stroke="#3E7C47" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M-11 -4 l6 -5 5 5z M11 -4 l-6 -5 -5 5z" fill="#0B1D30"/>
      <path d="M-9 6 q9 9 18 0 q-9 3 -18 0z" fill="#0B1D30"/>
    </g>
    <g transform="translate(534 346) scale(.7)">
      <ellipse cx="0" cy="0" rx="23" ry="19" fill="#DE9430"/>
      <path d="M-12 -18 q-2 -10 5 -13" stroke="#3E7C47" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <path d="M-11 -4 l6 -5 5 5z M11 -4 l-6 -5 -5 5z" fill="#0B1D30"/>
      <path d="M-8 6 q8 8 16 0 q-8 3 -16 0z" fill="#0B1D30"/>
    </g>
    <g transform="translate(186 350) scale(.58)">
      <ellipse cx="0" cy="0" rx="23" ry="19" fill="#F2A93B"/>
      <path d="M-12 -18 q-2 -10 5 -13" stroke="#3E7C47" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M-11 -4 l6 -5 5 5z M11 -4 l-6 -5 -5 5z" fill="#0B1D30"/>
      <path d="M-8 6 q8 8 16 0 q-8 3 -16 0z" fill="#0B1D30"/>
    </g>
  </g>

  <!-- picket fence, lower right -->
  <g fill="#08161F" opacity=".92">
    <rect x="596" y="344" width="7" height="44" rx="2"/>
    <rect x="614" y="350" width="7" height="38" rx="2"/>
    <rect x="632" y="344" width="7" height="44" rx="2"/>
    <rect x="650" y="352" width="7" height="36" rx="2"/>
    <rect x="668" y="346" width="7" height="42" rx="2"/>
    <rect x="592" y="358" width="88" height="5" rx="2"/>
  </g>
</svg>
