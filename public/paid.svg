<svg viewBox="0 0 24 24" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes bubble { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-10px); opacity: 0; } }
    .b1 { animation: bubble 2s infinite; }
    .b2 { animation: bubble 2s infinite 0.7s; }
  </style>
  <path d="M9 3h6m-3 0v6m-4 12h8a2 2 0 0 0 2-3l-3-9H8l-3 9a2 2 0 0 0 2 3z" stroke="#FF6B6B" stroke-width="2" fill="none" />
  <circle class="b1" cx="12" cy="12" r="1.5" fill="#FF6B6B" />
  <circle class="b2" cx="14" cy="10" r="1" fill="#FF6B6B" />
</svg>
<svg viewBox="0 0 24 24" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .cursor { animation: pulse 1s infinite; }
  </style>
  <rect x="2" y="4" width="20" height="13" rx="2" stroke="#4D96FF" stroke-width="2" fill="none"/>
  <path d="M7 8l-2 2 2 2m10-4l2 2-2 2" stroke="#4D96FF" stroke-width="2" fill="none"/>
  <rect class="cursor" x="9" y="13" width="6" height="1" fill="#4D96FF"/>
</svg>
<svg viewBox="0 0 24 24" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .gear { animation: spin 4s linear infinite; transform-origin: center; }
  </style>
  <g class="gear" stroke="#6BCB77" stroke-width="2" fill="none">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2v3m0 14v3M2 12h3m14 0h3m-3.1-6.9l-2.1 2.1m-9.8 9.8l-2.1 2.1m0-14l2.1 2.1m9.8 9.8l2.1 2.1"/>
  </g>
</svg>
<svg viewBox="0 0 24 24" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .math { animation: float 3s ease-in-out infinite; }
  </style>
  <rect x="4" y="2" width="16" height="20" rx="2" stroke="#FFD93D" stroke-width="2" fill="none"/>
  <g class="math" stroke="#FFD93D" stroke-width="2">
    <path d="M8 12h8M12 8v8M12 18h4" stroke-linecap="round"/>
  </g>
</svg>
