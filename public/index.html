<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SunScout – Summer Activities for Kids</title>
  <link rel="dns-prefetch" href="//images.unsplash.com">
  <link rel="dns-prefetch" href="//api.open-meteo.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#FFF9F0;color:#1a1a1a;min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
img{max-width:100%;display:block}
:root{
  --sun:#FF9900;--sky:#4FC3F7;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#1d4ed8;
  --tab1:#FFD93D;--tab2:#FF6B6B;--tab3:#4FC3F7;--tab4:#66BB6A;--tab5:#CE93D8;
  --radius:14px;--shadow:0 2px 14px rgba(0,0,0,.09);
}
.header{text-align:center;padding:28px 16px 0}
.logo{font-size:2.2rem;font-weight:900;color:var(--sun)}
.logo span{color:var(--sky)}
.tagline{font-size:.95rem;color:#666;font-weight:700;margin-top:4px}
.countdown{display:inline-block;font-size:12px;color:#666;background:#fff;border:1px solid #eee;border-radius:99px;padding:3px 14px;margin-top:8px}
/* Weather banner */
.weather-banner{display:none;margin:14px 16px 0;padding:12px 20px;border-radius:14px;font-weight:800;font-size:14px;color:#fff;text-align:center;transition:background .3s}
/* City fact */
.city-fact{text-align:center;font-size:12px;color:#888;font-weight:600;padding:6px 16px}
/* City bar */
.city-bar{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:14px 16px 0}
.city-btn{font-size:13px;font-weight:700;padding:7px 16px;border-radius:99px;border:2px solid transparent;background:#fff;color:#666;box-shadow:var(--shadow);transition:all .15s}
.city-btn:hover{background:#FFF3E0;color:#333}
.city-btn.on{background:var(--sun);color:#fff;border-color:#E68A00}
/* Tab bar */
.tab-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 16px 0}
.tab-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;border:none;border-radius:var(--radius);padding:11px 16px 13px;min-width:115px;flex:1 1 115px;max-width:150px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.tab-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.tab-btn.on{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.16)}
.tab-btn.on::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:28px;height:3px;background:rgba(0,0,0,.2);border-radius:99px}
.tab-icon{font-size:1.5rem;line-height:1}
.tab-label{font-size:11px;font-weight:900;text-align:center;line-height:1.2}
.tab-sub{font-size:9px;font-weight:600;opacity:.7;text-align:center}
.tab-free-dot{position:absolute;top:5px;right:5px;background:var(--green);color:#fff;font-size:9px;font-weight:900;padding:1px 5px;border-radius:5px}
.tab-btn[data-tab="free"]{background:var(--tab1);color:#5A3E00}
.tab-btn[data-tab="free"].on{background:#FF9900;color:#fff}
.tab-btn[data-tab="paid"]{background:var(--tab2);color:#fff}
.tab-btn[data-tab="paid"].on{background:#C0392B}
.tab-btn[data-tab="indoor"]{background:var(--tab3);color:#003A52}
.tab-btn[data-tab="indoor"].on{background:#0288D1;color:#fff}
.tab-btn[data-tab="outdoor"]{background:var(--tab4);color:#fff}
.tab-btn[data-tab="outdoor"].on{background:#2E7D32}
.tab-btn[data-tab="weekend"]{background:var(--tab5);color:#3A0050}
.tab-btn[data-tab="weekend"].on{background:#8E24AA;color:#fff}
/* Search */
.search-wrap{display:flex;align-items:center;gap:8px;padding:12px 16px 0;max-width:600px;margin:0 auto}
.search-icon{font-size:16px;color:#999}
.search-input{flex:1;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;padding:9px 16px;border-radius:99px;border:2px solid #eee;background:#fff;color:#1a1a1a;outline:none;transition:border .15s}
.search-input:focus{border-color:#FF9900}
.search-clear{font-size:12px;padding:4px 10px;border-radius:99px;border:none;background:#f0f0f0;color:#666}
/* Age bar */
.age-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;justify-content:center}
.age-btn{font-size:12px;font-weight:700;padding:5px 13px;border-radius:99px;border:1.5px solid rgba(0,0,0,.12);background:#fff;color:#666;transition:all .15s}
.age-btn.on{background:#1a1a1a;color:#fff;border-color:transparent}
.age-desc{font-weight:400;opacity:.8;font-size:11px}
/* Status */
.status-bar{font-size:13px;color:#666;padding:10px 16px 4px}
.status-bar strong{color:#1a1a1a}
/* Spinner */
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #eee;border-top-color:#FF9900;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:8px 16px 0}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
/* Card */
.card{background:#fff;border:1px solid rgba(0,0,0,.09);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.11)}
.card-img-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#f0f0f0;flex-shrink:0}
.card-img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .card-img{transform:scale(1.04)}
.card-img-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:linear-gradient(135deg,#FFF9E6,#E8F5FF)}
.badge-free{position:absolute;top:7px;left:7px;background:var(--green);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.badge-src{position:absolute;bottom:7px;left:7px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
.badge-daytrip{position:absolute;top:7px;right:7px;background:#7c3aed;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
.card-body{padding:10px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
.card-title{font-size:13px;font-weight:700;line-height:1.3;color:#1a1a1a}
.stars{font-size:12px;color:var(--amber);letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;white-space:nowrap}
.chip-a0{background:#dbeafe;color:#1e40af}
.chip-a1{background:#dcfce7;color:#166534}
.chip-a2{background:#fef9c3;color:#92400e}
.chip-a3{background:#f3e8ff;color:#6b21a8}
.chip-a11y{background:#f0f0f0;color:#555}
.chip-price{background:#fff3e0;color:#c05e00;border:1px solid #ffcc80}
.info{display:flex;gap:5px;font-size:11px;color:#666;line-height:1.4;align-items:flex-start}
.date-line{font-size:11px;color:#666}
.date-line strong{color:#1a1a1a}
.card-foot{display:flex;gap:6px;padding:7px 11px 11px;flex-wrap:wrap;margin-top:auto}
.btn{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;border:1.5px solid rgba(0,0,0,.12);background:transparent;color:#1a1a1a;display:inline-flex;align-items:center;gap:3px;transition:background .12s;text-decoration:none}
.btn:hover{background:#f3f3f3}
.btn-map{background:#dbeafe;color:var(--blue);border-color:transparent}
.btn-map:hover{background:#bfdbfe}
/* Show more */
.show-more-wrap{text-align:center;padding:20px 16px}
.show-more-btn{font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;padding:10px 32px;border-radius:99px;border:2px solid #FF9900;background:#fff;color:#FF9900;cursor:pointer;transition:all .15s}
.show-more-btn:hover{background:#FF9900;color:#fff}
.show-more-btn:disabled{opacity:.4;cursor:not-allowed}
/* No results */
.no-results{text-align:center;padding:2rem 1rem;grid-column:1/-1}
.no-results-icon{font-size:3rem;margin-bottom:10px}
.no-results h2{font-size:18px;font-weight:900;margin-bottom:8px}
.no-results p{font-size:13px;color:#666;margin-bottom:14px}
.diy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;text-align:left;max-width:700px;margin-left:auto;margin-right:auto}
.diy-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:12px;font-size:12px;color:#666}
.diy-card strong{display:block;font-size:13px;color:#1a1a1a;margin-bottom:4px}
/* Skeleton */
.card-skel .card-img-wrap{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;height:160px}
.skel-line{height:13px;margin:5px 0;border-radius:6px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.skel-short{width:60%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* Footer */
.footer{text-align:center;font-size:12px;color:#aaa;border-top:1px solid #eee;padding:20px 16px 40px;margin-top:20px}
/* Dark mode */
@media(prefers-color-scheme:dark){
  body{background:#1a1a1a;color:#f0f0f0}
  .card,.city-btn,.age-btn{background:#242424;border-color:rgba(255,255,255,.1)}
  .card-title{color:#f0f0f0}
  .info{color:#aaa}
}
@media(max-width:640px){
  .tab-btn{min-width:90px;max-width:110px;padding:9px 10px 11px}
  .tab-sub{display:none}
  .logo{font-size:1.8rem}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Sun<span>Scout</span> 🌤️</div>
  <p class="tagline">Your Summer Adventure, Simplified.</p>
  <div class="countdown" id="countdown">⏳ Loading...</div>
</div>

<!-- Weather banner — always shows, color-coded by temp -->
<div class="weather-banner" id="weatherBanner"></div>
<p class="city-fact" id="cityFact"></p>

<nav class="city-bar" aria-label="Select city">
  <button class="city-btn on" data-city="Sunnyvale"     onclick="setCity(this)">☀️ Sunnyvale</button>
  <button class="city-btn"    data-city="San Jose"      onclick="setCity(this)">🌉 San Jose</button>
  <button class="city-btn"    data-city="Cupertino"     onclick="setCity(this)">🍎 Cupertino</button>
  <button class="city-btn"    data-city="Mountain View" onclick="setCity(this)">🏔️ Mountain View</button>
  <button class="city-btn"    data-city="Palo Alto"     onclick="setCity(this)">🎓 Palo Alto</button>
  <button class="city-btn"    data-city="Saratoga"      onclick="setCity(this)">🌸 Saratoga</button>
  <button class="city-btn"    data-city="Fremont"       onclick="setCity(this)">🌉 Fremont</button>
</nav>

<div class="tab-bar" role="tablist" aria-label="Activity categories">
  <button class="tab-btn on" data-tab="free"    role="tab" aria-selected="true"  onclick="setTab(this)">
    <span class="tab-free-dot">$0</span>
    <span class="tab-icon">🆓</span>
    <span class="tab-label">Free Summer Activities</span>
    <span class="tab-sub">Parks · Libraries · Splash Pads</span>
  </button>
  <button class="tab-btn" data-tab="paid"    role="tab" aria-selected="false" onclick="setTab(this)">
    <span class="tab-icon">🎟️</span>
    <span class="tab-label">Paid Summer Activities</span>
    <span class="tab-sub">YMCA · STEM · Cooking</span>
  </button>
  <button class="tab-btn" data-tab="indoor"  role="tab" aria-selected="false" onclick="setTab(this)">
    <span class="tab-icon">🏛️</span>
    <span class="tab-label">Indoor Activities</span>
    <span class="tab-sub">Museums · Pools · Workshops</span>
  </button>
  <button class="tab-btn" data-tab="outdoor" role="tab" aria-selected="false" onclick="setTab(this)">
    <span class="tab-icon">🌳</span>
    <span class="tab-label">Outdoor Activities</span>
    <span class="tab-sub">Hiking · Petting Zoos · Farms</span>
  </button>
  <button class="tab-btn" data-tab="weekend" role="tab" aria-selected="false" onclick="setTab(this)">
    <span class="tab-icon">📅</span>
    <span class="tab-label">Weekend Activities</span>
    <span class="tab-sub">Sat & Sun Only</span>
  </button>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="search" id="searchInput" class="search-input"
    placeholder="Search park, swimming, library, splash pad…"
    aria-label="Search activities"
    oninput="setSearch(this.value)"/>
  <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">✕</button>
</div>

<div class="age-bar" role="group" aria-label="Filter by age">
  <button class="age-btn on" data-age="all" onclick="setAge(this)">🎯 All Ages</button>
  <button class="age-btn"    data-age="0"   onclick="setAge(this)">👶 0–2 <span class="age-desc">Infant/Toddler</span></button>
  <button class="age-btn"    data-age="1"   onclick="setAge(this)">🧸 3–5 <span class="age-desc">Preschool</span></button>
  <button class="age-btn"    data-age="2"   onclick="setAge(this)">🎒 6–12 <span class="age-desc">School Age</span></button>
  <button class="age-btn"    data-age="3"   onclick="setAge(this)">🛹 Teen <span class="age-desc">13–19</span></button>
</div>

<div class="status-bar" id="statusBar" aria-live="polite">Loading activities…</div>

<main id="main">
  <div class="grid" id="grid"></div>
  <div class="show-more-wrap" id="showMoreWrap" style="display:none">
    <button class="show-more-btn" id="showMoreBtn" onclick="showMore()">Show More Activities ↓</button>
  </div>
</main>

<div class="footer">
  <p>SunScout · Live data from Eventbrite, Google Places & Ticketmaster · Bay Area Summer 2026</p>
  <p style="margin-top:6px">🔄 Data refreshes every 10 minutes · Last updated <span id="lastUpdated">now</span></p>
</div>

async function loadActivities() {
  showSkeleton();
  try {
    var p = new URLSearchParams({ tab: activeTab, city: activeCity, age: activeAge });
    var r = await fetch("/api/activities?" + p);
    if (!r.ok) throw new Error("Server error " + r.status);
    var data = await r.json();
    allActivities = data.activities || [];
    showCount = PAGE_SIZE;
    var el = document.getElementById("lastUpdated");
    if (el && data.fetchedAt) el.textContent = new Date(data.fetchedAt).toLocaleTimeString();
    renderCards();
  } catch(e) { showError(e.message); }
}

function renderCards() {
  var grid   = document.getElementById("grid");
  var status = document.getElementById("statusBar");
  var wrap   = document.getElementById("showMoreWrap");
  var mbtn   = document.getElementById("showMoreBtn");
  var items  = allActivities.slice();
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    items = items.filter(function(a) {
      return (a.name||"").toLowerCase().indexOf(q) >= 0 || (a.desc||"").toLowerCase().indexOf(q) >= 0 || (a.address||"").toLowerCase().indexOf(q) >= 0;
    });
  }
  var total   = items.length;
  var visible = items.slice(0, showCount);
  status.innerHTML = "Showing <strong>" + visible.length + "</strong> of <strong>" + total + "</strong> activit" + (total===1?"y":"ies") + " in <strong>" + activeCity + "</strong>";
  if (wrap) wrap.style.display = total > PAGE_SIZE ? "block" : "none";
  if (mbtn) mbtn.disabled = visible.length >= total;
  if (visible.length === 0) {
    grid.innerHTML = "<div class=\"no-results\"><div class=\"no-results-icon\">🌻</div><h2>" + (searchQuery ? "No results for &quot;" + searchQuery + "&quot;" : "No activities found!") + "</h2><p>" + (searchQuery ? "Try a different search term." : "Try a different city, tab, or age filter.") + "</p><p>Meanwhile — 3 FREE DIY activities:</p><div class=\"diy-grid\">" + DIY.map(function(d){ return "<div class=\"diy-card\"><strong>" + d.title + "</strong><p>" + d.desc + "</p></div>"; }).join("") + "</div></div>";
    return;
  }
  grid.innerHTML = visible.map(function(a) {
    var src  = getImageSrc(a);
    var fb   = IMG_FALLBACK[a.category] || IMG_FALLBACK.free;
    var ds   = a.startDate ? (a.endDate && a.startDate!==a.endDate ? fmtDate(a.startDate)+" – "+fmtDate(a.endDate) : fmtDate(a.startDate)) : (a.dates||"Summer 2026");
    var st   = a.stars ? "★".repeat(Math.min(5,a.stars))+"☆".repeat(5-Math.min(5,a.stars)) : "";
    var mu   = a.mapsUrl || "https://www.google.com/maps/search/"+encodeURIComponent((a.name||"")+" "+(a.city||activeCity)+" CA");
    var ac   = (a.ages||[]).map(function(g){ return "<span class=\"chip "+(AGE_COLORS[g]||"")+"\">"+( AGE_LABELS[g]||g)+"</span>"; }).join("");
    var a11  = (a.a11y||[]).map(function(t){ return "<span class=\"chip chip-a11y\">"+t+"</span>"; }).join("");
    var pc   = (!a.isFree&&a.price) ? "<span class=\"chip chip-price\">"+a.price+"</span>" : "";
    return "<article class=\"card\"><div class=\"card-img-wrap\"><img src=\""+src+"\" alt=\"\" loading=\"eager\" style=\"width:100%;height:100%;object-fit:cover\" onerror=\"this.src='"+fb+"';this.onerror=null\"/><span class=\"badge-free\">"+(a.isFree?"$0 FREE":(a.price||"See site"))+"</span>"+(a.source?"<span class=\"badge-src\">"+(SRC_LABELS[a.source]||a.source)+"</span>":"")+"</div><div class=\"card-body\"><h3 class=\"card-title\">"+(a.name||"")+"</h3>"+(st?"<div class=\"stars\">"+st+"</div>":"")+"<div class=\"chips\">"+ac+a11+pc+"</div>"+(a.address?"<p class=\"info\"><span>📍</span><span>"+a.address+"</span></p>":"")+(a.phone?"<p class=\"info\"><span>📞</span><span>"+a.phone+"</span></p>":"")+"<p class=\"date-line\">📅 <strong>"+ds+"</strong></p>"+(a.desc?"<p class=\"info\"><span></span><span>"+a.desc.slice(0,120)+(a.desc.length>120?"…":"")+"</span></p>":"")+"</div><div class=\"card-foot\"><a class=\"btn btn-map\" href=\""+mu+"\" target=\"_blank\" rel=\"noopener\">🗺 Map</a>"+(a.website?"<a class=\"btn\" href=\""+a.website+"\" target=\"_blank\" rel=\"noopener\">🌐 Site</a>":"")+"</div></article>";
  }).join("");
}

function showSkeleton() {
  document.getElementById("grid").innerHTML = Array(8).fill("").map(function(){ return "<div class=\"card card-skel\"><div class=\"card-img-wrap\"></div><div class=\"card-body\"><div class=\"skel-line\"></div><div class=\"skel-line skel-short\"></div></div></div>"; }).join("");
  document.getElementById("statusBar").innerHTML = "<span class=\"spinner\"></span> Loading activities in "+activeCity+"…";
  var w = document.getElementById("showMoreWrap"); if (w) w.style.display="none";
}

function showError(msg) {
  document.getElementById("grid").innerHTML = "<div class=\"no-results\"><div class=\"no-results-icon\">⚠️</div><h2>Could not load activities</h2><p>"+msg+"</p><button class=\"show-more-btn\" onclick=\"loadActivities()\" style=\"margin-top:12px\">Try Again</button></div>";
  document.getElementById("statusBar").innerHTML = "Error loading activities";
}

function fmtDate(d) {
  if (!d) return "";
  return new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

function setCity(btn) {
  var clicked = btn.dataset.city;
  if (activeCity === clicked) {
    btn.classList.remove("on"); activeCity = null;
    document.getElementById("cityFact").textContent = "";
    document.getElementById("grid").innerHTML = "<div class=\"no-results\"><div class=\"no-results-icon\">🏙️</div><h2>Select a city!</h2></div>";
    document.getElementById("statusBar").innerHTML = "Select a city to get started";
    return;
  }
  document.querySelectorAll(".city-btn").forEach(function(b){ b.classList.remove("on"); });
  btn.classList.add("on");
  activeCity=clicked; activeAge="all"; searchQuery=""; showCount=PAGE_SIZE;
  var si=document.getElementById("searchInput"); if(si) si.value="";
  document.getElementById("cityFact").textContent = CITY_FACTS[activeCity]||"";
  document.querySelectorAll(".age-btn").forEach(function(b){ b.classList.toggle("on",b.dataset.age==="all"); });
  fetchWeather(activeCity);
  loadActivities();
}

function setTab(btn) {
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("on"); b.setAttribute("aria-selected","false"); });
  btn.classList.add("on"); btn.setAttribute("aria-selected","true");
  activeTab=btn.dataset.tab; activeAge="all"; searchQuery=""; showCount=PAGE_SIZE;
  var si=document.getElementById("searchInput"); if(si) si.value="";
  document.querySelectorAll(".age-btn").forEach(function(b){ b.classList.toggle("on",b.dataset.age==="all"); });
  if (activeCity) loadActivities();
}

function setAge(btn) {
  var clicked = btn.dataset.age;
  if (activeAge===clicked && clicked!=="all") {
    document.querySelectorAll(".age-btn").forEach(function(b){ b.classList.toggle("on",b.dataset.age==="all"); });
    activeAge="all";
  } else {
    document.querySelectorAll(".age-btn").forEach(function(b){ b.classList.remove("on"); });
    btn.classList.add("on"); activeAge=clicked;
  }
  showCount=PAGE_SIZE; if(activeCity) loadActivities();
}

function setSearch(val) {
  searchQuery=val.trim(); showCount=PAGE_SIZE;
  var cl=document.getElementById("searchClear"); if(cl) cl.style.display=val?"block":"none";
  renderCards();
}

function clearSearch() {
  searchQuery="";
  var si=document.getElementById("searchInput"); if(si) si.value="";
  var cl=document.getElementById("searchClear"); if(cl) cl.style.display="none";
  showCount=PAGE_SIZE; renderCards();
}

function showMore() {
  showCount+=PAGE_SIZE; renderCards();
  window.scrollBy({top:400,behavior:"smooth"});
}

function updateCountdown() {
  var end=new Date(new Date().getFullYear()+"-08-31");
  var days=Math.max(0,Math.ceil((end-new Date())/86400000));
  var el=document.getElementById("countdown");
  if(el) el.textContent=days>0?"⏳ "+days+" days of summer left!":"🍂 Summer has ended!";
}

document.getElementById("cityFact").textContent = CITY_FACTS["Sunnyvale"];
updateCountdown();
fetchWeather("Sunnyvale");
loadActivities();
</script>
</body>
</html>
